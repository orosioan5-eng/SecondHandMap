<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Second Hand Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: rgba(255, 255, 255, 0.92);
      --surface-solid: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #10b981;
      --accent-soft: #ecfdf5;
      --warn: #f59e0b;
      --danger: #ef4444;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 40px rgba(15, 23, 42, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Top bar */
    .topbar {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .brand-icon {
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary);
      color: white;
      border-radius: 6px;
      font-size: 13px;
    }
    .brand-meta {
      font-weight: 500;
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: var(--shadow-md), 0 0 0 3px rgba(15, 23, 42, 0.08);
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .icon-btn {
      width: 44px; height: 44px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      cursor: pointer;
      color: var(--text);
      transition: background .15s, transform .1s, color .15s, border-color .15s;
      padding: 0;
    }
    .icon-btn:hover { background: var(--surface-solid); }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Filter panel */
    .panel {
      position: fixed;
      top: calc(72px + var(--safe-top));
      left: 12px;
      right: 12px;
      z-index: 999;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 16px;
      transform: translateY(-12px);
      opacity: 0;
      pointer-events: none;
      transition: transform .2s ease, opacity .2s ease;
    }
    .panel.open {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .panel-section + .panel-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .panel-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 7px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
    }
    .chip:hover { border-color: var(--primary); }
    .chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-row span { font-size: 14px; font-weight: 500; }
    .toggle {
      position: relative;
      width: 42px; height: 24px;
      background: var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 20px; height: 20px;
      background: white;
      border-radius: 50%;
      box-shadow: var(--shadow-sm);
      transition: transform .15s;
    }
    .toggle.on { background: var(--accent); }
    .toggle.on::after { transform: translateX(18px); }

    /* Bottom info bar */
    .footer {
      position: fixed;
      left: 12px;
      bottom: calc(12px + var(--safe-bottom));
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-md);
      font-size: 12px;
      color: var(--text-muted);
    }
    .footer strong { color: var(--text); font-weight: 600; }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* Popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 0;
    }
    .leaflet-popup-content { margin: 0; min-width: 240px; }
    .leaflet-popup-tip { box-shadow: var(--shadow-md); }

    .popup {
      padding: 0;
      font-family: inherit;
    }
    .popup-body { padding: 14px 16px; }
    .popup h3 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .popup-gallery {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 2px;
      width: 100%;
      height: 140px;
      background: var(--bg);
      overflow: hidden;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .popup-gallery.single { grid-template-columns: 1fr; }
    .popup-gallery.double { grid-template-columns: 1fr 1fr; }
    .popup-gallery .lb-trigger {
      display: block;
      overflow: hidden;
      position: relative;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      font: inherit;
    }
    .popup-gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .2s;
    }
    .popup-gallery .lb-trigger:hover img { transform: scale(1.05); }
    .popup-gallery .more {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.55);
      color: white;
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
    }
    .popup .rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .popup .rating .stars { color: var(--warn); }
    .popup .rating .count { color: var(--text-muted); font-weight: 400; }
    .popup .addr {
      font-size: 13px;
      color: var(--text-muted);
      margin: 8px 0 0;
      line-height: 1.4;
    }
    .popup .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .popup .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 6px;
    }
    .popup .badge.open { background: var(--accent-soft); color: var(--accent); }
    .popup .badge.closed { background: #fef2f2; color: var(--danger); }
    .popup .hours {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .popup .hours summary {
      cursor: pointer;
      color: var(--text);
      font-weight: 500;
      list-style: none;
    }
    .popup .hours summary::-webkit-details-marker { display: none; }
    .popup .hours summary::after { content: ' ▾'; color: var(--text-muted); }
    .popup .hours[open] summary::after { content: ' ▴'; }
    .popup .hours ul { margin: 6px 0 0; padding: 0; list-style: none; }
    .popup .hours li { padding: 2px 0; }
    .popup .actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .popup .btn {
      flex: 1;
      padding: 8px 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: background .15s;
    }
    .popup .btn:hover { background: var(--primary-hover); }
    .popup .btn.secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .popup .btn.secondary:hover { background: var(--bg); }

    /* Custom marker pins */
    .pin {
      width: 32px; height: 32px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2.5px solid white;
      box-shadow: 0 3px 10px rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s ease;
    }
    .pin:hover { transform: rotate(-45deg) scale(1.08); }
    .pin-inner {
      transform: rotate(45deg);
      color: white;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .pin.high { background: linear-gradient(135deg, #10b981, #059669); }
    .pin.mid  { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .pin.low  { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .pin.none { background: linear-gradient(135deg, #94a3b8, #64748b); }

    /* Cluster styling */
    .marker-cluster {
      background: rgba(15, 23, 42, 0.1);
      border-radius: 50%;
    }
    .marker-cluster div {
      background: var(--primary);
      color: white;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 13px;
      border: 3px solid white;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
      width: 36px;
      height: 36px;
      margin-left: 2px;
      margin-top: 2px;
      line-height: 30px;
    }
    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div { background: var(--primary); }
    .marker-cluster-medium div { width: 40px; height: 40px; line-height: 34px; }
    .marker-cluster-large div { width: 46px; height: 46px; line-height: 40px; font-size: 14px; }

    /* Floating action buttons (bottom-right stack) */
    .fab-stack {
      position: fixed;
      right: 12px;
      bottom: calc(80px + var(--safe-bottom));
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fab {
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      cursor: pointer;
      color: var(--text);
      transition: transform .12s ease, background .15s;
      padding: 0;
    }
    .fab:hover { background: var(--bg); }
    .fab:active { transform: scale(0.92); }
    .fab.loading { pointer-events: none; }
    .fab.loading svg { animation: spin 0.8s linear infinite; }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .brand-meta { display: none; }
      .brand { padding: 10px 12px; font-size: 14px; }
      .panel { left: 8px; right: 8px; padding: 14px; }
      .topbar { left: 8px; right: 8px; }
    }

    /* Empty state */
    .empty {
      position: fixed;
      bottom: calc(60px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 10px 16px;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow-md);
      font-size: 13px;
      color: var(--text-muted);
      display: none;
    }
    .empty.show { display: block; }

    /* Loading state */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: opacity .3s;
    }
    .loader.hide { opacity: 0; pointer-events: none; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      animation: lb-fade .18s ease-out;
      padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));
    }
    .lightbox.open { display: flex; }
    @keyframes lb-fade { from { opacity: 0; } to { opacity: 1; } }

    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: var(--radius-md);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      user-select: none;
      -webkit-user-drag: none;
    }

    .lightbox-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      color: white;
      cursor: pointer;
      padding: 0;
      transition: background .15s, transform .12s;
    }
    .lightbox-btn:hover { background: rgba(255, 255, 255, 0.25); }
    .lightbox-btn:active { transform: scale(0.92); }
    .lightbox-btn:disabled { opacity: 0.3; pointer-events: none; }

    .lightbox-close { top: calc(20px + var(--safe-top)); right: 20px; }
    .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }
    .lightbox-prev:active, .lightbox-next:active { transform: translateY(-50%) scale(0.92); }

    .lightbox-counter {
      position: absolute;
      bottom: calc(20px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 13px;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    @media (max-width: 640px) {
      .lightbox-prev, .lightbox-next {
        width: 40px; height: 40px;
      }
      .lightbox-prev { left: 12px; }
      .lightbox-next { right: 12px; }
      .lightbox-close { top: calc(12px + var(--safe-top)); right: 12px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="loader" id="loader"><div class="spinner"></div></div>

  <div class="topbar">
    <div class="brand">
      <span class="brand-icon">SH</span>
      <span>Second Hand Map</span>
      <span class="brand-meta" id="brandCity"></span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input type="search" class="search-input" id="search" placeholder="Cauta dupa nume sau adresa..." autocomplete="off" />
    </div>
    <button class="icon-btn" id="filterBtn" aria-label="Filtre">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="7" y1="12" x2="17" y2="12"></line>
        <line x1="10" y1="18" x2="14" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="panel" id="panel">
    <div class="panel-section">
      <span class="panel-label">Rating minim</span>
      <div class="chip-row" id="ratingChips">
        <button class="chip active" data-rating="0">Toate</button>
        <button class="chip" data-rating="3">3+</button>
        <button class="chip" data-rating="4">4+</button>
        <button class="chip" data-rating="4.5">4.5+</button>
      </div>
    </div>
    <div class="panel-section">
      <div class="toggle-row">
        <span>Doar deschise acum</span>
        <div class="toggle" id="openToggle" role="switch" aria-checked="false" tabindex="0"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="dot"></span>
    <span><strong id="count">0</strong> locatii</span>
    <span>·</span>
    <span id="updated">—</span>
  </div>

  <div class="empty" id="empty">Nicio locatie pentru filtrele curente</div>

  <div class="fab-stack">
    <button class="fab" id="locateBtn" aria-label="Locatia mea" title="Locatia mea">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 1v3M12 20v3M1 12h3M20 12h3"></path>
        <circle cx="12" cy="12" r="9"></circle>
      </svg>
    </button>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Galerie foto">
    <button class="lightbox-btn lightbox-close" id="lbClose" aria-label="Inchide">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"></path>
      </svg>
    </button>
    <button class="lightbox-btn lightbox-prev" id="lbPrev" aria-label="Anterior">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    </button>
    <img class="lightbox-img" id="lbImg" alt="" />
    <button class="lightbox-btn lightbox-next" id="lbNext" aria-label="Urmator">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"></path>
      </svg>
    </button>
    <div class="lightbox-counter" id="lbCounter"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const filters = { rating: 0, openOnly: false, query: '' };
      let map, markersLayer, allLocations = [];

      function ratingClass(r) {
        if (r == null) return 'none';
        if (r >= 4) return 'high';
        if (r >= 3) return 'mid';
        return 'low';
      }

      function buildIcon(loc) {
        const cls = ratingClass(loc.rating);
        const label = loc.rating ? loc.rating.toFixed(1) : '?';
        return L.divIcon({
          className: '',
          html: `<div class="pin ${cls}"><span class="pin-inner">${label}</span></div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 30],
          popupAnchor: [0, -28],
        });
      }

      function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
      }

      function safeHttpUrl(url) {
        if (!url) return '';
        try {
          const u = new URL(url);
          return (u.protocol === 'http:' || u.protocol === 'https:') ? url : '';
        } catch {
          return '';
        }
      }

      function safeTel(phone) {
        if (!phone) return '';
        const digits = String(phone).replace(/[^\d+]/g, '');
        return /^\+?\d{4,20}$/.test(digits) ? digits : '';
      }

      function stars(rating) {
        if (rating == null) return '<span class="count">fara rating</span>';
        const full = Math.floor(rating);
        const half = rating - full >= 0.5;
        let s = '';
        for (let i = 0; i < full; i++) s += '★';
        if (half) s += '☆';
        return `<span class="stars">${s}</span> <span>${rating.toFixed(1)}</span>`;
      }

      function galleryHtml(photos) {
        if (!Array.isArray(photos) || !photos.length) return '';
        const safe = photos.filter(p => typeof p === 'string' && /^photos\/[A-Za-z0-9_\-]+\.jpg$/.test(p)).slice(0, 3);
        if (!safe.length) return '';
        const cls = safe.length === 1 ? 'single' : safe.length === 2 ? 'double' : '';
        const list = safe.map(p => escapeHtml(p)).join('|');
        const items = safe.map((p, i) =>
          `<button type="button" class="lb-trigger" data-photos="${list}" data-index="${i}" aria-label="Deschide poza ${i + 1}"><img src="${escapeHtml(p)}" alt="" loading="lazy" /></button>`
        ).join('');
        return `<div class="popup-gallery ${cls}">${items}</div>`;
      }

      function popupHtml(loc) {
        const openBadge = loc.open_now === true
          ? '<span class="badge open">● Deschis acum</span>'
          : loc.open_now === false
          ? '<span class="badge closed">● Inchis</span>'
          : '';
        const ratingLine = (loc.rating != null)
          ? `<div class="rating">${stars(loc.rating)} <span class="count">(${loc.total_ratings || 0})</span></div>`
          : '<div class="rating"><span class="count">fara rating</span></div>';
        const hours = Array.isArray(loc.hours) && loc.hours.length
          ? `<details class="hours"><summary>Program</summary><ul>${loc.hours.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ul></details>`
          : '';
        const directions = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}&destination_place_id=${encodeURIComponent(loc.place_id || '')}`;
        const safePhone = safeTel(loc.phone);
        const callBtn = safePhone
          ? `<a class="btn secondary" href="tel:${safePhone}">Suna</a>`
          : '';
        const safeSite = safeHttpUrl(loc.website);
        const siteBtn = safeSite
          ? `<a class="btn secondary" href="${escapeHtml(safeSite)}" target="_blank" rel="noopener noreferrer">Website</a>`
          : '';
        return `
          <div class="popup">
            ${galleryHtml(loc.photos)}
            <div class="popup-body">
              <h3>${escapeHtml(loc.name)}</h3>
              ${ratingLine}
              ${loc.address ? `<p class="addr">${escapeHtml(loc.address)}</p>` : ''}
              ${openBadge ? `<div class="meta">${openBadge}</div>` : ''}
              ${hours}
              <div class="actions">
                <a class="btn" href="${directions}" target="_blank" rel="noopener noreferrer">Directii</a>
                ${callBtn}
                ${siteBtn}
              </div>
            </div>
          </div>
        `;
      }

      function applyFilters() {
        markersLayer.clearLayers();
        const q = filters.query.trim().toLowerCase();
        const batch = [];
        for (const loc of allLocations) {
          if (filters.rating > 0 && (loc.rating || 0) < filters.rating) continue;
          if (filters.openOnly && loc.open_now !== true) continue;
          if (q) {
            const hay = `${loc.name || ''} ${loc.address || ''}`.toLowerCase();
            if (!hay.includes(q)) continue;
          }
          const m = L.marker([loc.lat, loc.lng], { icon: buildIcon(loc) });
          // Lazy popup: only build HTML on first open
          m.bindPopup(() => popupHtml(loc), { closeButton: true, maxWidth: 320 });
          batch.push(m);
        }
        markersLayer.addLayers(batch);
        $('count').textContent = batch.length;
        $('empty').classList.toggle('show', batch.length === 0 && allLocations.length > 0);
      }

      let filterTimer = null;
      function applyFiltersDebounced() {
        clearTimeout(filterTimer);
        filterTimer = setTimeout(applyFilters, 80);
      }

      function fmtUpdated(iso) {
        if (!iso) return '—';
        try {
          const d = new Date(iso);
          return 'Actualizat ' + d.toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' });
        } catch { return iso; }
      }

      function bindUI() {
        $('filterBtn').addEventListener('click', () => {
          const p = $('panel');
          const open = p.classList.toggle('open');
          $('filterBtn').classList.toggle('active', open);
        });
        $('search').addEventListener('input', (e) => {
          filters.query = e.target.value;
          applyFiltersDebounced();
        });
        $('ratingChips').addEventListener('click', (e) => {
          const btn = e.target.closest('.chip');
          if (!btn) return;
          $('ratingChips').querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          btn.classList.add('active');
          filters.rating = parseFloat(btn.dataset.rating);
          applyFilters();
        });
        const toggleOpen = () => {
          filters.openOnly = !filters.openOnly;
          $('openToggle').classList.toggle('on', filters.openOnly);
          $('openToggle').setAttribute('aria-checked', String(filters.openOnly));
          applyFilters();
        };
        $('openToggle').addEventListener('click', toggleOpen);
        $('openToggle').addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleOpen(); }
        });
        $('locateBtn').addEventListener('click', locateMe);
        bindLightbox();
      }

      // === Lightbox ===
      const lb = { photos: [], index: 0 };

      function bindLightbox() {
        // Event delegation: gallery buttons live inside popups (built lazily)
        document.addEventListener('click', (e) => {
          const trig = e.target.closest('.lb-trigger');
          if (!trig) return;
          const list = (trig.dataset.photos || '').split('|').filter(Boolean);
          const idx = parseInt(trig.dataset.index, 10) || 0;
          if (list.length) openLightbox(list, idx);
        });
        $('lbClose').addEventListener('click', closeLightbox);
        $('lbPrev').addEventListener('click', () => navLightbox(-1));
        $('lbNext').addEventListener('click', () => navLightbox(1));
        $('lightbox').addEventListener('click', (e) => {
          // Click on backdrop (not the image or controls) closes
          if (e.target.id === 'lightbox') closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
          if (!$('lightbox').classList.contains('open')) return;
          if (e.key === 'Escape') closeLightbox();
          else if (e.key === 'ArrowLeft') navLightbox(-1);
          else if (e.key === 'ArrowRight') navLightbox(1);
        });
      }

      function openLightbox(photos, index) {
        lb.photos = photos;
        lb.index = Math.max(0, Math.min(index, photos.length - 1));
        renderLightbox();
        $('lightbox').classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        $('lightbox').classList.remove('open');
        document.body.style.overflow = '';
      }

      function navLightbox(delta) {
        const next = lb.index + delta;
        if (next < 0 || next >= lb.photos.length) return;
        lb.index = next;
        renderLightbox();
      }

      function renderLightbox() {
        $('lbImg').src = lb.photos[lb.index];
        $('lbCounter').textContent = `${lb.index + 1} / ${lb.photos.length}`;
        $('lbPrev').disabled = lb.index === 0;
        $('lbNext').disabled = lb.index === lb.photos.length - 1;
        // Hide counter and arrows if only one photo
        const single = lb.photos.length === 1;
        $('lbPrev').style.display = single ? 'none' : '';
        $('lbNext').style.display = single ? 'none' : '';
        $('lbCounter').style.display = single ? 'none' : '';
      }

      let userMarker = null;
      function locateMe() {
        if (!navigator.geolocation) {
          alert('Geolocatia nu este disponibila in acest browser');
          return;
        }
        const btn = $('locateBtn');
        btn.classList.add('loading');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            btn.classList.remove('loading');
            const { latitude: lat, longitude: lng } = pos.coords;
            if (userMarker) userMarker.remove();
            userMarker = L.circleMarker([lat, lng], {
              radius: 8,
              color: '#fff',
              weight: 3,
              fillColor: '#3b82f6',
              fillOpacity: 1,
            }).addTo(map);
            map.flyTo([lat, lng], 15, { duration: 0.8 });
          },
          (err) => {
            btn.classList.remove('loading');
            alert('Nu am putut accesa locatia: ' + (err.message || 'permis refuzat'));
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
      }

      async function load() {
        let configCenter = { lat: 44.4268, lng: 26.1025, zoom: 12 };
        let cityName = '';
        try {
          const cfgRes = await fetch('config.json', { cache: 'no-store' });
          if (cfgRes.ok) {
            const cfg = await cfgRes.json();
            if (cfg.center) configCenter = { ...configCenter, ...cfg.center };
            if (cfg.city) cityName = cfg.city;
          }
        } catch {}

        map = L.map('map', {
          zoomControl: false,
          preferCanvas: true,
        }).setView([configCenter.lat, configCenter.lng], configCenter.zoom);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        markersLayer = L.markerClusterGroup({
          showCoverageOnHover: false,
          spiderfyOnMaxZoom: true,
          disableClusteringAtZoom: 16,
          maxClusterRadius: 50,
          chunkedLoading: true,
        }).addTo(map);

        if (cityName) $('brandCity').textContent = '· ' + cityName;

        try {
          const res = await fetch('locations.json', { cache: 'no-store' });
          if (!res.ok) throw new Error('locations.json missing');
          const data = await res.json();
          allLocations = (data.locations || []).filter(l => typeof l.lat === 'number' && typeof l.lng === 'number');
          $('updated').textContent = fmtUpdated(data.updated_at);
          if (allLocations.length) {
            const bounds = L.latLngBounds(allLocations.map(l => [l.lat, l.lng]));
            map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15 });
          }
          applyFilters();
        } catch (err) {
          console.error(err);
          $('count').textContent = '0';
          $('updated').textContent = 'date indisponibile';
        } finally {
          $('loader').classList.add('hide');
        }
      }

      bindUI();
      load();
    })();
  </script>
</body>
</html>
